---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-web
spec:
  selector:
    matchLabels:
      app: golang-web
  replicas: 1
  template:
    metadata:
      labels:
        app: golang-web
      annotations:
        sidecar.istio.io/inject: "false"

    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: golang-web
        image: ghcr.io/andriykalashnykov/golang-web:0.0.3@sha256:f7d591a2422e2fae17f61384874933c1a8aeff448f3c322f82bead84ba7c2012

        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

        # 8Mi/10m caused liveness restarts (117 in 46 h): the pod cgroup hit its memory limit,
        # the kernel evicted the binary's code pages, and reclaim under a 1 ms/100 ms CPU quota
        # stalled the process past three probe timeouts.
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"

        env:

        # 404 if request not to this context
        - name: APP_CONTEXT
          value: "/myhello/"

        # default message
        - name: MESSAGE_TO
          value: "World"

        # Downward API support - inserts these into container as env variables
        # https://kubernetes.io/docs/tasks/inject-data-application/environment-variable-expose-pod-information/#use-pod-fields-as-values-for-environment-variables
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        - name: MY_POD_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName

        - name: PORT
          value: "8080"

        # Go heap soft limit, below limits.memory; change both together. Needs the "B" suffix:
        # "20Mi" makes the Go runtime exit (malformed GOMEMLIMIT).
        - name: GOMEMLIMIT
          value: "20MiB"

        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 15

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2

---
apiVersion: v1
kind: Service
metadata:
  name: golang-web-service
  labels:
    app: golang-web
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    name: http
    targetPort: 8080
    protocol: TCP
  selector:
    app: golang-web
