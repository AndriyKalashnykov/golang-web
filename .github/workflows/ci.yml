name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - '!CLAUDE.md'
      - 'docs/**'
      - 'specs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claudeignore'
      - '.claude/**'
      - 'benchmarks/**'
      - '**.png'
      - '**.jpg'
      - '**.gif'
      - '**.svg'
  pull_request:
    paths-ignore:
      - '*.md'
      - '!CLAUDE.md'
      - 'docs/**'
      - 'specs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claudeignore'
      - '.claude/**'
      - 'benchmarks/**'
      - '**.png'
      - '**.jpg'
      - '**.gif'
      - '**.svg'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_REGISTRY: ghcr.io
  FULL_IMAGE_NAME: ${{ github.repository }}

jobs:

  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # mise provisions Go AND every pinned quality/security tool from
      # .mise.toml, so a separate actions/setup-go step would be redundant
      # work and a second place for the Go version to drift.
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      - name: Static check
        run: make static-check

  build:
    needs: [static-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # mise provisions Go AND every pinned quality/security tool from
      # .mise.toml, so a separate actions/setup-go step would be redundant
      # work and a second place for the Go version to drift.
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      - name: Build
        run: make build

  test:
    needs: [static-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # mise provisions Go AND every pinned quality/security tool from
      # .mise.toml, so a separate actions/setup-go step would be redundant
      # work and a second place for the Go version to drift.
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      - name: Test with coverage
        run: make coverage-check

      - name: Upload coverage artifact
        # Skipped under `make ci-run`: act 0.2.89's artifact server rejects upload-artifact@v7
        # ("unknown field mime_type", nektos/act#6022), so the step could only fail there.
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        continue-on-error: true
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write       # registry push
      id-token: write       # cosign keyless OIDC (Sigstore Fulcio)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Convert owner to lower case
        run: |
          echo "OWNER_LC=${OWNER,,}" >>"${GITHUB_ENV}"
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/golang-web
          # Bare semver on Docker image tags. The `{{version}}` template
          # automatically strips the `v` from source git tag `vX.Y.Z`.
          # auto: a prerelease tag (e.g. v0.0.4-rc.1) does not move `latest`.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.vendor=Andriy Kalashnykov - andriykalashnykov@gmail.com
            org.opencontainers.image.title=HTTP web server with Prometheus metrics in Go
            org.opencontainers.image.description=HTTP web server with Prometheus metrics in Go
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ github.ref_name }}
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/AndriyKalashnykov/golang-web/main/README.md
            io.artifacthub.package.maintainers=[{"name":"Andriy Kalashnykov","email":"andriykalashnykov@gmail.com"}]
            io.artifacthub.package.license=MIT

      # ----------------------------------------------------------------
      # GATE 1: Build single-arch image locally for security checks.
      # docker/build-push-action cannot do load:true + push:true +
      # attestations in one step, so we build twice. The second build
      # is ~95% cache-hit via cache-from: type=gha.
      # ----------------------------------------------------------------
      - name: Build image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: golang-web:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MY_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            MY_BUILTBY=github-action

      # ----------------------------------------------------------------
      # GATE 2: Trivy image scan — CRITICAL/HIGH blocks the release.
      # Catches CVEs in the base image and OS packages added during
      # build that filesystem-only scans (in static-check) cannot see.
      # ----------------------------------------------------------------
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'golang-web:scan'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      # ----------------------------------------------------------------
      # GATE 3: Smoke test — run the container, verify /healthz responds.
      # distroless/nonroot has no shell, so the check is fully external.
      # ----------------------------------------------------------------
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name golang-web-smoke -p 18080:8080 golang-web:scan
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/healthz | grep -q '"health":"ok"'; then
              echo "Smoke test passed on attempt $i"
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "Smoke test failed — container logs:"
            docker logs golang-web-smoke || true
            docker rm -f golang-web-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          docker rm -f golang-web-smoke >/dev/null 2>&1 || true

      # ----------------------------------------------------------------
      # All gates passed → push multi-arch with attestations BY DIGEST (no tags
      # yet), sign and verify that digest, and only then attach the release tags.
      # Pushing tags first could publish `latest` unsigned if signing failed.
      # ----------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.GH_REGISTRY }}/${{ env.OWNER_LC }}/golang-web,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MY_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            MY_BUILTBY=github-action

      # ----------------------------------------------------------------
      # Sign the pushed digest once (cosign keyless OIDC via Sigstore Fulcio/Rekor),
      # verify it, then tag. A tag is published only for a verified signed digest.
      # ----------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        env:
          IMAGE: ${{ env.GH_REGISTRY }}/${{ env.OWNER_LC }}/golang-web
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the signature
        env:
          IMAGE: ${{ env.GH_REGISTRY }}/${{ env.OWNER_LC }}/golang-web
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if cosign verify "${IMAGE}@${DIGEST}" \
                 --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null; then
              echo "Signature verified for ${IMAGE}@${DIGEST}"; exit 0
            fi
            if [ "$i" -lt 3 ]; then sleep $((i * 10)); fi
          done
          echo "::error::no valid signature for ${IMAGE}@${DIGEST}; release tags NOT published"; exit 1

      - name: Tag the signed image
        env:
          IMAGE: ${{ env.GH_REGISTRY }}/${{ env.OWNER_LC }}/golang-web
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "${TAGS}"
          # Tagging must not change the index digest, or the signature would not cover it: check the
          # would-be digest BEFORE any tag moves, then again after.
          dry=$(docker buildx imagetools create --dry-run "${args[@]}" "${IMAGE}@${DIGEST}")
          would="sha256:$(printf '%s' "$dry" | sha256sum | cut -d' ' -f1)"
          [ "$would" = "$DIGEST" ] || { echo "::error::tagging would publish ${would}, not the signed ${DIGEST}; no tags moved"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$got" = "$DIGEST" ] || { echo "::error::${tag} points at ${got}, not the signed ${DIGEST}"; exit 1; }
          done <<< "${TAGS}"
          echo "Tagged ${IMAGE}@${DIGEST}: $(tr '\n' ' ' <<< "${TAGS}")"
