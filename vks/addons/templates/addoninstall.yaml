# One VKS add-on for one guest cluster. vks/addons/ISTIO.md and vks/addons/HEADLAMP.md fill this
# file with envsubst. It is applied on the SUPERVISOR, in the vSphere Namespace that holds the
# cluster; VKS then installs the add-on into the guest cluster.
# The label marks it as made by these guides: their uninstall blocks delete nothing without it.
# stopMatchingBehavior Delete: deleting this object removes the add-on from the cluster.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: ${ADDON_INSTALL}
  namespace: ${VKS_NAMESPACE}
  labels:
    vks-golang-web/created-by: addons-guide
spec:
  addonRef:
    name: ${ADDON_NAME}
    namespace: ${ADDON_CATALOG_NAMESPACE}
  clusters:
    - selector:
        matchLabels:
          cluster.x-k8s.io/cluster-name: ${VKS_CLUSTER}
  crossNamespaceSelection: Blocked
  releaseFilter:
    ref:
      name: ${ADDON_RELEASE}
      namespace: ${ADDON_CATALOG_NAMESPACE}
  stopMatchingBehavior: Delete
