# mise tool pins -- the single source of truth for local dev AND CI.
#
# Renovate has first-class `mise` manager support, so every pin below is
# tracked automatically. Do NOT add inline `# renovate:` comments here:
# that would invite a duplicate custom.regex customManager and
# cross-manager drift (the Makefile constants these replaced are gone).
#
# `go` is ALSO declared in go.mod (`go X.Y.Z`) and in the Dockerfile
# builder stage. All three MUST agree -- `make check-toolchain-alignment`
# is the gate that enforces it.

[tools]
# === Language toolchains ===
go = "1.27.2"
# Node exists solely to run `npx renovate` (make renovate). The Renovate
# CLI requires Node >= 24; a renovate.json rule holds this on major 24.
node = "24"

# === Linters / quality gates ===
"aqua:golangci/golangci-lint" = "2.14.0"
"aqua:rhysd/actionlint"       = "1.7.12"
"aqua:koalaman/shellcheck"    = "0.11.0"
"aqua:hadolint/hadolint"      = "2.15.1"

# === Security scanners ===
# gosec is built from an UNRELEASED upstream commit, temporarily. Its latest release (2.29.0)
# cannot read what Go 1.27.2 compiles ("export data version 5 is greater than maximum supported
# version 4"), as a release binary and when built from source; the commit below can. Go 1.27.2
# is needed for five standard-library fixes. REMOVE WHEN a gosec release newer than 2.29.0
# exists: go back to  "aqua:securego/gosec" = "<that release>".
"go:github.com/securego/gosec/v2/cmd/gosec" = "7b1b5cebe007d62fb58eacb90fc571112939ec30"
"aqua:gitleaks/gitleaks"      = "8.30.1"
"aqua:aquasecurity/trivy"     = "0.75.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"

# === Local Kubernetes / CI ===
"aqua:kubernetes-sigs/kind"   = "0.33.0"
"aqua:nektos/act"             = "0.2.89"

# === Utilities ===
# jq reads podman's manifest list in `make image-push`.
"aqua:jqlang/jq"              = "1.8.2"
